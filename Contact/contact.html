<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engage With Us | DataSpy Technologies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <!-- Header -->
  <section class="contact-hero">
    <h1>Engage With Us</h1>
   
    <h2>Start Your Digital Journey With DataSpy</h2>
     <p>Tell us about yourself — we’ll reach out shortly</p>
  </section>

  <!-- Contact Form -->
  <section class="contact-container">
    <form class="contact-form" onsubmit="showPopup(event)">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" required placeholder="example@email.com">
      </div>

      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" required placeholder="10-digit mobile number">
      </div>

      <div class="form-group">
        <label>Educational Qualification</label>
        <input type="text" placeholder="e.g. BE, BSc, MCA, Diploma">
      </div>

      <div class="form-group">
        <label>Certifications (if any)</label>
        <input type="text" placeholder="e.g. Python, AWS, Cloud, AI/ML">
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea rows="4" placeholder="Tell us what you are looking for"></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit</button>

    </form>
  </section>

  <!-- Popup -->
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <h2>Thank You!</h2>
      <p>We will contact you shortly.</p>
      <button onclick="closePopup()">OK</button>
    </div>
  </div>

  <script src="contact.js"></script>
</body>
</html>
